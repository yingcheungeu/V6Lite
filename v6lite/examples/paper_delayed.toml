# V6-Lite — G2-D delayed paper rehearsal config.
# Copy to C:\Dev\TradingV6\v6lite.paper.delayed.toml before use.
# Run only with --dry-run; this example holds no secrets.
#
# Paper runs with the SAME capital cap and limits as the planned live pilot so
# the rehearsal is realistic (paper NLV is ~$1M, sizing uses min(NLV, cap)).

mode = "paper"

[ibkr]
host = "127.0.0.1"
port = 4002                 # IB Gateway paper
client_id = 131             # legacy V6 uses 120; never share a client id
account = "DU0000000"
market_data_type = 3        # delayed data; run with --dry-run only

[universe]
# The ten symbols already selected for Controlled Paper in the RR-CP plan.
tradable = ["GOOGL", "AAPL", "IWM", "ABT", "IBB", "PANW", "META", "TSLA", "SPY", "AMZN"]
scan = ["GOOGL", "AAPL", "IWM", "ABT", "IBB", "PANW", "META", "TSLA", "SPY", "AMZN"]
etf = ["IWM", "IBB", "SPY"]
protected = ["MSTR"]        # never traded, never managed

[sectors]
GOOGL = "tech"
AAPL = "tech"
PANW = "tech"
META = "tech"
AMZN = "tech"
TSLA = "consumer"
ABT = "healthcare"
IBB = "healthcare"
IWM = "index"
SPY = "index"

[strategy]
scan_times_et = ["10:00", "13:30"]   # ET wall clock (fixes the PT/ET scan-time bug)
min_score = 60
high_vix_threshold = 30.0
high_vix_min_score = 75
bars_lookback_days = 90
atr_stop_mult = 2.5
tp1_mult = 3.0
tp2_mult = 5.0
tp3_mult = 8.0
breakeven_offset_pct = 0.0005

[risk]
max_capital_usd = 10000.0
risk_per_trade_pct = 0.01          # $100 at risk per trade on $10k
max_position_pct = 0.50
max_order_notional_usd = 5000.0
max_positions = 2
max_per_sector = 1
max_daily_entries = 4              # submissions, counted before sending
daily_loss_limit_usd = 150.0       # limit = min(usd, pct * start-of-day capital)
daily_loss_limit_pct = 0.015
max_consecutive_losses = 2
loss_cooldown_minutes = 60
entry_window_start_et = "10:00"
entry_cutoff_minutes_before_close = 30

[execution]
entry_limit_band_pct = 0.003
exit_limit_band_pct = 0.002
tp_max_quote_age_seconds = 3
max_spread_pct = 0.005
max_quote_age_seconds = 15
entry_fill_timeout_seconds = 60
exit_fill_timeout_seconds = 45
exit_max_retries = 3
cancel_grace_seconds = 5
reconcile_interval_seconds = 300
exit_check_interval_seconds = 30

[protection]
# constraint relies on John's accepted operating constraints A and B.
# Every TP/BE still requires fresh ledger/position/GTC/visible-fill checks.
overnight_tp = "freeze"
enabled = true
order_type = "STP"
gap_a_p1_seconds = 5
gap_a_p0_seconds = 15
gap_b_cancel_seconds = 10
gap_b_p0_seconds = 30
trigger_unfilled_p0_seconds = 60
steady_check_seconds = 15
evidence_fail_p0_seconds = 60

[paths]
state_dir = "~/.v6lite/paper-delayed"  # separate G2-D rehearsal state
foreign_lock_paths = ["state/trading_bot_v6.lock", "trading_bot.lock"]

[alerts]
email_to = ""                # e.g. your phone-visible inbox
email_from = ""
smtp_host = ""               # e.g. smtp.gmail.com (use an app password)
smtp_port = 587
smtp_user = ""
smtp_password_env = "V6LITE_SMTP_PASSWORD"
discord_webhook_env = "V6LITE_DISCORD_WEBHOOK"
require_remote_in_live = true
